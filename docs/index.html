<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>d2l-ja GitHub Pages</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --panel: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #2563eb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        padding: 20px 28px;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      header h1 {
        margin: 0;
        font-size: 1.4rem;
      }
      header p {
        margin: 6px 0 0;
        color: var(--muted);
      }
      .layout {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: calc(100vh - 88px);
      }
      aside {
        border-right: 1px solid var(--border);
        background: var(--panel);
        padding: 20px;
        overflow-y: auto;
      }
      .search {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 0.95rem;
        margin-bottom: 16px;
      }
      nav ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      nav a {
        display: block;
        padding: 8px 10px;
        border-radius: 8px;
        color: var(--text);
        text-decoration: none;
        font-size: 0.95rem;
      }
      nav a:hover,
      nav a.is-active {
        background: #e0e7ff;
        color: #1d4ed8;
      }
      main {
        padding: 24px 32px 60px;
        overflow-x: auto;
      }
      .status {
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 16px;
      }
      .markdown-body {
        background: var(--panel);
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      }
      .toc-list {
        padding-left: 1.2rem;
      }
      .toc-list li {
        margin: 6px 0;
      }
      @media (max-width: 960px) {
        .layout {
          grid-template-columns: 1fr;
        }
        aside {
          border-right: none;
          border-bottom: 1px solid var(--border);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>d2l-ja GitHub Pages</h1>
      <p>Markdown を読みやすい HTML として表示します。</p>
    </header>
    <div class="layout">
      <aside>
        <input class="search" data-search type="search" placeholder="章を検索" />
        <nav>
          <ul data-nav></ul>
        </nav>
      </aside>
      <main>
        <div class="status" data-status>読み込み中...</div>
        <article class="markdown-body" data-content></article>
      </main>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.2/markdown-it.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it-anchor/8.6.7/markdownItAnchor.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="viewer.js"></script>
  </body>
</html>
